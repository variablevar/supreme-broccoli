[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.2

; IMNOSHI_API_HOST/PORT/BASE are concatenated in src/phase2.cpp to
; build the device-facing endpoints. Point them at the customer app
; (imnoshi-web). Override locally with `-DIMNOSHI_API_HOST=...` etc.
; for production.
build_flags =
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_GFXFF
    -DSPI_FREQUENCY=40000000
    -DIMNOSHI_API_HOST=\"localhost\"
    -DIMNOSHI_API_PORT=3000
    -DIMNOSHI_API_BASE=\"/api/devices\"

; To upload + open the serial monitor in one shot:
;   pio run -t upload -t monitor