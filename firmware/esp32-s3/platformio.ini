; Reference ESP32-S3 DevKitC-1 + ST7789 170x320 wiring.
; Verify these pins against your physical board before flashing.
[env:esp32-s3-devkitc-1]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@7.4.2
build_flags =
  -DUSER_SETUP_LOADED
  -DST7789_DRIVER
  -DTFT_WIDTH=170
  -DTFT_HEIGHT=320
  -DTFT_MISO=-1
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=9
  -DTFT_RST=8
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DSPI_FREQUENCY=27000000
